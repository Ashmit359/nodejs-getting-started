apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
        - name: node-app
          image: 499133675204.dkr.ecr.ap-south-1.amazonaws.com/devops-project/node-app:v1
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
